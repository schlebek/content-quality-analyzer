name: Bug report
description: Something isn't working as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Before submitting, please search existing issues to avoid duplicates."

  - type: input
    id: plugin_version
    attributes:
      label: Plugin version
      placeholder: "e.g. 1.5.1"
    validations:
      required: true

  - type: input
    id: wp_version
    attributes:
      label: WordPress version
      placeholder: "e.g. 6.7"
    validations:
      required: true

  - type: input
    id: php_version
    attributes:
      label: PHP version
      placeholder: "e.g. 8.2"
    validations:
      required: true

  - type: input
    id: gemini_model
    attributes:
      label: Gemini model in use
      placeholder: "e.g. gemini-3.5-flash"

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: What happened? What did you expect?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to…
        2. Click…
        3. See error
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Error messages, screenshots, browser console output — anything that helps.
